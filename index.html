<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><img src="images.jpg" alt="Logo"></li>
                <li>
                    <h1>Circuit Simulator</h1>
                </li>
            </ul>
        </nav>
    </header>

    <div class="workspace">

        <aside class="circuit_elements">

            <button>
                <img src="" alt="">
                <span>Wire</span>
            </button>

            <button>
                <img src="" alt="">
                <span>Switch</span>
            </button>

            <button>
                <img src="resistor.svg" alt="resistor_img">
                <span>Resistor</span>
            </button>

            <button>
                <img src="capacitor.svg" alt="capacitor_img">
                <span>Capacitor</span>
            </button>

            <button>
                <img src="inductor.svg" alt="inductor_img">
                <span>Inductor</span>
            </button>

            <button>
                <img src="diode.svg" alt="diode_img">
                <span>Diode</span>
            </button>

            <button>
                <img src="voltage.svg" alt="voltage_source_img">
                <span>Voltage Source</span>
            </button>

            <button>
                <img src="current.svg" alt="current_source_img">
                <span>Current Source</span>
            </button>

            <button>
                <img src="ground.svg" alt="ground_img">
                <span>Ground</span>
            </button>
            
        </aside>



        <main>
            
            <section>

            </section>
        </main>

        <aside class="right-box">
            
        </aside>

    </div>
</body>

</html>
